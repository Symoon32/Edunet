<h2 class="text-center mb-4">Mis Evaluaciones y Tareas</h2>

<div *ngIf="loading" class="text-center">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
</div>

<div *ngIf="!loading && tareas.length === 0" class="alert alert-info text-center">
  No tienes evaluaciones o tareas registradas.
</div>

<div class="table-responsive" *ngIf="!loading && tareas.length > 0">
  <table class="table table-striped table-bordered align-middle text-center shadow">
    <thead class="table-primary">
      <tr>
        <th>Actividad</th>
        <th>Materia</th>
        <th>Fecha Asignación</th>
        <th>Nota</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tarea of tareas">
        <td>{{ tarea.nombre }}</td>
        <td>{{ tarea.materia }}</td>
        <td>{{ tarea.fecha_asignacion | date:'mediumDate' }}</td>
        <td>
          <span *ngIf="tarea.estado === 'Calificado'">{{ tarea.valor }}</span>
          <span *ngIf="tarea.estado !== 'Calificado'">-</span>
        </td>
        <td><span class="badge" [ngClass]="getBadgeClass(tarea.estado)">{{ tarea.estado }}</span></td>
      </tr>
    </tbody>
  </table>
</div>
