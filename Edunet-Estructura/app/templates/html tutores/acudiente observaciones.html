<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Observaciones del Estudiante</title>
  <link rel="stylesheet" href="/static/css tutor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css tutor/observaciones.css">
</head>
<body class="min-vh-100 d-flex flex-column">

  <header class="d-flex align-items-center bg-primary text-white p-3">
    <img src="/static/img/logo sin fondo.png" alt="Logo" class="me-3" style="height:60px;">
    <h1 class="h4 mb-0">Portal de Padres</h1>
  </header>

  <nav class="background-dark">
    <div class="container">
      <ul class="nav nav-pills py-2">
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html tutores/principal acudiente.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html tutores/acudiente observaciones.html"> observaciones</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html tutores/notas acudiente.html">Notas</a></li>
        <li class="nav-item"><a class="nav-link text-white active" href="/Edunet-Estructura/app/templates/html tutores/acudiente comunicacion.html">Mensajes</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html tutores/acudiente calendario.html">Calendario</a></li>
        <a href="/Edunet-Estructura/app/templates/inicio de sesion.html" class="btn btn-danger">
        <i class="bi bi-box-arrow-right"></i></a>
      </ul>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="card-title text-primary mb-4" id="observaciones-titulo">Observaciones del Estudiante</h2>
            <form class="row g-3 align-items-center mb-4">
              <div class="col-auto">
                <label for="seleccionar-estudiante" class="col-form-label fw-bold">Seleccionar estudiante:</label>
              </div>
              <div class="col-auto">
                <select id="seleccionar-estudiante" class="form-select" onchange="mostrarObservaciones()">
                  <option value="">-- Selecciona --</option>
                  <option value="juan">Juan Ruiz</option>
                  <option value="camila">Camila Gómez</option>
                </select>
              </div>
            </form>
            <div id="observaciones-lista" class="observaciones-lista">
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-light text-center py-3 mt-auto">
    <p class="mb-0">&copy; 2025 Edunet - Todos los derechos reservados</p>
  </footer>

  <script>
    const observaciones = {
      juan: [
        "Tiene buen desempeño en matemáticas.",
        "Debe mejorar su puntualidad.",
        "Participa activamente en clase."
      ],
      camila: [
        "Presentó tareas incompletas la última semana.",
        "Destaca en actividades artísticas.",
        "Necesita reforzar comprensión lectora."
      ]
    };

    function mostrarObservaciones() {
      const estudiante = document.getElementById('seleccionar-estudiante').value;
      const contenedor = document.getElementById('observaciones-lista');
      contenedor.innerHTML = '';

      if (estudiante && observaciones[estudiante]) {
        observaciones[estudiante].forEach(obs => {
          const div = document.createElement('div');
          div.className = 'observacion';
          div.textContent = obs;
          contenedor.appendChild(div);
        });
      }
    }
  </script>
<script src="/Edunet-Estructura/static/js tutor/bootstrap.bundle.min.js"></script>
</body>
</html>
