<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/app/static/css admin/estilos_crear_usuarios.css">
</head>
<body class="min-vh-100 d-flex flex-column">

  <header class="d-flex align-items-center p-3 header-color text-white">
    <img src="/app/static/img/logo sin fondo.png" alt="Escudo del colegio" class="logo me-3" />
    <h1 class="h4 m-0">Bienvenidos a EduNet - Admin</h1>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
      <span style="color: white;">Nombre del Usuario</span>
      <a href="/app/templates/html estudiantes/perfilbootstrap.html" title="Perfil del usuario">
        <img src="/app/static/img/foto perfil.avif" alt="Perfil" style="width: 32px; height: 32px; border-radius: 50%;">
      </a>
    </div>
  </header>

  <nav class="background-dark">
    <div class="container">
      <ul class="nav nav-pills py-2">
        <li class="nav-item"><a class="nav-link" href="./principal.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="./gestion_usuarios.html">Gestión de Usuarios</a></li>
        <li class="nav-item"><a class="nav-link" href="./Gestion Academica.html">Gestión Académica</a></li>
        <li class="nav-item"><a class="nav-link" href="./configurar_cursos.html">Configurar Cursos</a></li>
        <li class="nav-item"><a class="nav-link" href="./reportes.html">Reportes</a></li>
        <li class="nav-item"><a class="nav-link" href="./informes.html">Estadísticas</a></li>
        <li class="nav-item"><a class="nav-link" href="./comunicacion_general.html">Comunicacion general</a></li>
        <li class="nav-item"><a class="nav-link" href="./anuncios_boletines.html">Anuncios y Boletines</a></li>
        <a href="/app/templates/inicio de sesion.html" class="btn btn-danger">
          <i class="bi bi-box-arrow-right"></i>
        </a>
      </ul>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-header bg-primary text-white">
            <h2 class="h5 mb-0">Registrar nuevo usuario</h2>
          </div>
          <div class="card-body">
            <form method="POST">
              <div class="mb-3">
                <input placeholder="Nombres" type="text" class="form-control" id="nombres" name="nombres" required>
              </div>
              <div class="mb-3">
                <input placeholder="Apellidos" type="text" class="form-control" id="apellidos" name="apellidos" required>
              </div>
              <div class="mb-3">
                <input placeholder="Correo" type="email" class="form-control" id="correo" name="correo" required>
              </div>
              <div class="mb-3">
                <input placeholder="Telefono" type="cell" class="form-control" id="contrasena" name="Telefono" required>
              </div>
              <div class="mb-3">
                <input placeholder="Documento" type="document" class="form-control" id="contrasena" name="Documento" required>
              </div>
              <div class="mb-3">
                <input placeholder="Dirección" type="address" class="form-control" id="contrasena" name="Dirección" required>
              </div>
              <div class="mb-3">
                <input placeholder="Contraseña" type="password" class="form-control" id="contrasena" name="Dirección" required>
              </div>
              <div class="mb-3">
                <select class="form-select" id="rol" name="rol" required>
                  <option value="" selected disabled>Seleccione un rol</option>
                  <option value="1">Estudiante</option>
                  <option value="2">Profesor</option>
                  <option value="3">Acudiente</option>
                  <option value="4">Administrador</option>
                </select>
              </div>

              <!-- Campos para Estudiante -->
              <div class="mb-3 d-none" id="campos-estudiante">
                <input placeholder="Grado" type="text" class="form-control mb-2" name="grado">
                <hr>
                <h4>Contacto de emergencia</h4>
                <input placeholder="Nombre Contacto de emergencia" type="text" class="form-control mb-2" name="Contacto">
                <input placeholder="Telefono Contacto de emergencia" type="text" class="form-control mb-2" name="Contacto">
              </div>

              <!-- Campos para Profesor -->
              <div class="mb-3 d-none" id="campos-profesor">
                <input placeholder="Curso asignado" type="text" class="form-control" name="titulo">
              </div>

              <!-- Campos para Acudiente -->
              <div class="mb-3 d-none" id="campos-acudiente">
                <input placeholder="Nombre del estudiante a cargo" type="text" class="form-control mb-2" name="estudiante_relacionado">
                <input placeholder="Parentezco" type="text" class="form-control" name="parentezco">
              </div>

              <!-- Campos para Admin -->
               <div class="mb-3 d-none" id="campos-admin">
                <input placeholder="Cargo dentro de la institución (Ej: Director)" type="text" class="form-control" name="cargo">
              </div>

              <button type="submit" class="btn btn-primary w-100" id="registrar">Registrar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 footer-color">
    <p class="mb-0">&copy; 2025 Colegio Jorge Isaacs - EduNet</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const rolSelect = document.getElementById("rol");

      const camposEstudiante = document.getElementById("campos-estudiante");
      const camposProfesor = document.getElementById("campos-profesor");
      const camposAcudiente = document.getElementById("campos-acudiente");
      const camposAdmin = document.getElementById("campos-admin");

      rolSelect.addEventListener("change", function () {
        const rol = this.value;

        // Ocultar todos
        camposEstudiante.classList.add("d-none");
        camposProfesor.classList.add("d-none");
        camposAcudiente.classList.add("d-none");
        camposAdmin.classList.add("d-none");

        // Mostrar según el rol
        if (rol === "1") {
          camposEstudiante.classList.remove("d-none");
        } else if (rol === "2") {
          camposProfesor.classList.remove("d-none");
        } else if (rol === "3") {
          camposAcudiente.classList.remove("d-none");
        } else if (rol === "4") {
          camposAdmin.classList.remove("d-none");
        }
      });
    });
  </script>
</body>
</html>
