<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comunicación directa - Profesores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/Edunet-Estructura/app/static/css profesores/comunicacion2.css"/> 
</head>
<body>
 <header class="d-flex align-items-center p-3 header-color text-white">
    <img src="/Edunet-Estructura/app/static/img/logo sin fondo.png" alt="Escudo del colegio" class="logo me-3" />
    <h1 class="h4 m-0">Bienvenidos a EduNet - Docentes</h1>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
      <span style="color: white;">Nombre del Usuario</span>
      <a href="/Edunet-Estructura/app/templates/html estudiantes/perfilbootstrap.html" title="Perfil del usuario">
        <img src="/Edunet-Estructura/app/static/img/foto perfil.avif" alt="Perfil" style="width: 32px; height: 32px; border-radius: 50%;">
      </a>
    </div>
  </header>

  <nav class="background-dark">
    <div class="container">
      <ul class="nav nav-pills py-2">
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/index pagina principal Profesores.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores gestion de clase.html"> Gestión de clases</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores Material Educativo.html">Gestion de Material</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores Calificar material.html">Calificar Material</a></li>
        <li class="nav-item"><a class="nav-link text-white active" href="/Edunet-Estructura/app/templates/html profesores/Profesores Comunicación.html">Comunicación</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores Reportes.html"> Generar Reportes</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores Estadisticas.html">Estadisticas</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores Cargar nota.html">Cargar notas</a></li>
        <a href="/Edunet-Estructura/app/templates/inicio de sesion.html" class="btn btn-danger">
        <i class="bi bi-box-arrow-right"></i></a>
      </ul>
    </div>
  </nav>

  <main class="main-container">
    <section class="formulario-mensaje">
      <h2 class="mb-3">Enviar Mensaje</h2>
      <div class="field">
        <label for="destinatario" class="form-label">Destinatario:</label>
        <select id="destinatario" class="form-select">
          <option value="" disabled selected>Selecciona un destinatario</option>
          <option value="estudiante">Estudiante</option>
          <option value="padre">Acudiente</option>
        </select>
      </div>
      <div class="field">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" id="nombre" class="form-control" placeholder="Nombre del destinatario">
      </div>
      <div class="field">
        <label for="mensaje" class="form-label">Mensaje:</label>
        <textarea id="mensaje" class="form-control" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
      </div>
      <button onclick="enviarMensaje()" class="btn btn-primary">Enviar</button>
    </section>

    <section class="chat-box mt-5">
      <h2 class="mb-3">Chat</h2>
      <div class="chat-container" id="chatContainer">
      </div>
    </section>
  </main>

  <div class="modal fade" id="mensajeModal" tabindex="-1" aria-labelledby="mensajeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="mensajeModalLabel">Editar o Eliminar Mensaje</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <textarea id="mensajeEditado" class="form-control" rows="4"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" id="btnEliminar">Eliminar</button>
          <button type="button" class="btn btn-primary" id="btnGuardar">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/Edunet-Estructura/app/static/js/js profesores/comunicacion2.js"></script>
  <footer class="text-center py-3 footer-color">
    <p class="mb-0">&copy; 2025 Colegio Jorge Isaacs - EduNet</p>
  </footer>
</body>
</html>
