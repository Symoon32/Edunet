<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/app/static/css profesores/reportes2.css" />
</head>
<body>
 <header class="d-flex align-items-center p-3 text-white">
    <img src="/app/static/img/logo sin fondo.png" alt="Escudo del colegio" class="logo" />
    <h1 class="h4 m-0">Bienvenidos a EduNet - Docentes</h1>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
      <span style="color: white;">Nombre del Usuario</span>
      <a href="/app/templates/html estudiantes/perfilbootstrap.html" title="Perfil del usuario">
        <img src="/app/static/img/foto perfil.avif" alt="Perfil" style="width: 32px; height: 32px; border-radius: 50%;">
      </a>
    </div>
  </header>

   <nav class="background-dark">
    <div class="container">
      <ul class="nav nav-pills py-2">
        <li class="nav-item"><a class="nav-link text-white" href="/app/templates/html profesores/index pagina principal Profesores.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/app/templates/html profesores/Profesores gestion de clase.html"> Gestión de clases</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/app/templates/html profesores/Profesores Material Educativo.html">Gestion de Material</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/app/templates/html profesores/Profesores Calificar material.html">Calificar Material</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/app/templates/html profesores/Profesores Comunicación.html">Comunicación</a></li>
        <li class="nav-item"><a class="nav-link text-white active" href="/app/templates/html profesores/Profesores Reportes.html"> Generar Reportes</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/app/templates/html profesores/Profesores Estadisticas.html">Estadisticas</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/app/templates/html profesores/Profesores Cargar nota.html">Cargar notas</a></li>
        <a href="/app/templates/inicio de sesion.html" class="btn btn-danger">
        <i class="bi bi-box-arrow-right"></i></a>
      </ul>
    </div>
  </nav>

  <main class="main-container">
    <section class="reportes">
      <h2>Generar Reportes de Progreso Académico</h2>
      <form id="formReporte">
        <div class="campo">
          <label for="estudiante">Estudiante</label>
          <input type="text" id="estudiante" placeholder="Nombre del estudiante" required>
        </div>

        <div class="campo">
          <label for="grado">Grado</label>
          <select id="grado" required>
            <option value="">Seleccione</option>
            <option value="6">Sexto</option>
            <option value="7">Séptimo</option>
            <option value="8">Octavo</option>
            <option value="9">Noveno</option>
            <option value="10">Décimo</option>
            <option value="11">Undécimo</option>
          </select>
        </div>

        <div class="campo">
          <label for="detalle">Observaciones</label>
          <textarea id="detalle" rows="5" placeholder="Notas u observaciones del desempeño..."></textarea>
        </div>

        <button type="submit">Generar reporte</button>
      </form>

      <div id="resultadoReporte" class="reporte-generado"></div>
    </section>
  </main>

  <script src="/app/static/js/js profesores/reportes2.js"></script>
  <footer class="text-center py-3 footer-color">
    <p class="mb-0">&copy; 2025 Colegio Jorge Isaacs - EduNet</p>
  </footer>
</body>
</html>
