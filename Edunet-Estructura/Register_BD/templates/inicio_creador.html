<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos principal.css') }}"> 
    <title>Registro de Usuarios</title>
</head>
<body class="min-vh-100 d-flex flex-column">

  <header class="d-flex align-items-center bg-primary text-white p-3">
    <img src="{{ url_for('static', filename='img/escudo.jpg') }}" alt="Logo" class="me-3" style="height:60px;">
    <h1 class="h4 mb-0">Creador de usuarios</h1>
  </header>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item mx-4"><a class="nav-link active" href="{{ url_for('main') }}">Inicio</a></li>
        <li class="nav-item mx-4"><a class="nav-link" href="{{ url_for('register') }}">Crear Usuario</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section>
      <img src="{{ url_for('static', filename='img/escudo.jpg') }}" alt="Escudo del colegio" height="250px" width="250px" />
      <h2>Gestión de usuarios</h2>
      <p>Desde este panel podrá gestionar la creación de los nuevos usuarios.</p>
    </section>

    <section class="galeria">
      <h2>Galería Institucional</h2>
      <div class="galeria-container">
        <img src="{{ url_for('static', filename='img/gradoas.jpg') }}" alt="Grados" class="foto" />
        <img src="{{ url_for('static', filename='img/niños cancha.jpg') }}" alt="Espacios recreativos" class="foto" />
        <img src="{{ url_for('static', filename='img/colegio arriba.jpg') }}" alt="Instalaciones del colegio" class="foto" />
      </div>
    </section>
  </main>
    
  <footer class="bg-light text-center py-3 mt-auto">
    <p class="mb-0">&copy; 2025 Edunet - Todos los derechos reservados</p>
  </footer>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
