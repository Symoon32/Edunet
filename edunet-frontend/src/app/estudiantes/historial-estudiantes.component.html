<h2 class="mb-4 text-center">Mi Historial Académico</h2>

<div *ngIf="loading" class="text-center">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
</div>

<div *ngIf="!loading && materias.length === 0" class="alert alert-info text-center">
  No tienes cursos asignados o calificaciones registradas.
</div>

<div *ngIf="!loading && materias.length > 0">
  <!-- Filters -->
  <div class="row g-2 mb-3 justify-content-end">
    <div class="col-md-5">
       <div class="input-group input-group-sm">
           <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
           <input type="text" class="form-control border-start-0" placeholder="Buscar materia..." [(ngModel)]="searchTerm">
       </div>
    </div>
    <div class="col-md-3">
       <div class="input-group input-group-sm">
           <span class="input-group-text bg-white border-end-0"><i class="bi bi-funnel"></i></span>
           <select class="form-select border-start-0" [(ngModel)]="filterEstado">
               <option value="todos">Todos</option>
               <option value="aprobado">Aprobado (>= 3.0)</option>
               <option value="reprobado">Reprobado (< 3.0)</option>
           </select>
       </div>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-hover text-center align-middle tabla-historial">
      <thead class="table-light">
        <tr>
          <th>Asignatura</th>
          <th>Notas</th>
          <th>Promedio Acumulado</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let materia of materiasFiltradas">
          <td class="fw-bold">{{ materia.nombre }}</td>
          <td>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
            <span *ngFor="let nota of materia.calificaciones"
                  class="badge bg-light text-dark border"
                  [title]="nota.nombre + ' (' + nota.peso + '%)'">
              {{ nota.valor }}
            </span>
            <span *ngIf="materia.calificaciones.length === 0" class="text-muted">Sin notas</span>
          </div>
        </td>
        <td [class.text-danger]="materia.promedio < 3.0"
            [class.text-success]="materia.promedio >= 3.0"
            class="fw-bold fs-5">
          {{ materia.promedio }}
        </td>
      </tr>
      <tr *ngIf="materiasFiltradas.length === 0">
          <td colspan="3" class="py-4 text-muted">No se encontraron materias con los filtros seleccionados.</td>
      </tr>
    </tbody>
  </table>
  </div>
</div>
