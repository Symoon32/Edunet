<h2 class="text-center mb-4">Materiales de Estudio</h2>

<div *ngIf="loading" class="text-center">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
</div>

<div *ngIf="!loading && listaMateriales.length === 0" class="alert alert-info text-center">
  No hay materiales publicados para tus cursos.
</div>

<div *ngFor="let item of listaMateriales" class="mb-5">
  <h3 class="border-bottom pb-2">{{ item.nombreMateria }}</h3>

  <div class="row gy-3">
    <div class="col-md-6" *ngFor="let material of item.materiales">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="card-title mb-0">{{ material.titulo }}</h5>
            <i [class]="getIconClass(material.tipo)" style="font-size: 1.5rem;"></i>
          </div>
          <p class="card-text text-muted flex-grow-1">{{ material.descripcion }}</p>
          <div class="d-grid mt-3">
            <a [href]="material.url_archivo" target="_blank" class="btn" [ngClass]="getBtnClass(material.tipo)">
              {{ getActionText(material.tipo) }}
            </a>
          </div>
        </div>
        <div class="card-footer text-muted small">
          Publicado: {{ material.fecha_publicacion | date:'mediumDate' }}
        </div>
      </div>
    </div>
  </div>
</div>
