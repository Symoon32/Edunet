<div class="row g-4">
  <!-- Left Column: Create Form -->
  <div class="col-lg-5">
    <div class="card shadow-sm border-0 h-100">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-pencil-square me-2"></i>Publicar Aviso</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="anuncioForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label small text-muted">Título</label>
            <input type="text" class="form-control" formControlName="titulo" placeholder="Título del anuncio">
          </div>

          <div class="mb-3">
            <label class="form-label small text-muted">Contenido</label>
            <textarea class="form-control" rows="5" formControlName="descripcion" placeholder="Escribe el contenido aquí..."></textarea>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label small text-muted">Inicio</label>
              <input type="datetime-local" class="form-control form-control-sm" formControlName="fecha_inicio">
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted">Fin</label>
              <input type="datetime-local" class="form-control form-control-sm" formControlName="fecha_fin">
            </div>
          </div>

          <div class="row g-2 mb-4">
            <div class="col-md-6">
              <label class="form-label small text-muted">Tipo</label>
              <select class="form-select form-select-sm" formControlName="tipo">
                <option value="anuncio">📢 Anuncio</option>
                <option value="evento">📅 Evento</option>
                <option value="noticia">📰 Noticia</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted">Para</label>
              <select class="form-select form-select-sm" formControlName="destinatarios">
                <option value="todos">Todos</option>
                <option value="estudiantes">Estudiantes</option>
                <option value="profesores">Profesores</option>
                <option value="padres">Padres</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label small text-muted">Ubicación (Opcional)</label>
              <div class="input-group input-group-sm">
                <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                <input type="text" class="form-control" formControlName="ubicacion" placeholder="Ej: Auditorio Principal">
              </div>
            </div>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary" [ngClass]="isEditing ? 'btn-warning text-white' : 'btn-primary'">
              {{ isEditing ? 'Actualizar Publicación' : 'Publicar Ahora' }}
            </button>
            <button type="button" class="btn btn-light text-muted" *ngIf="isEditing" (click)="resetForm()">
              Cancelar Edición
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Right Column: Feed -->
  <div class="col-lg-7">
    <div class="card shadow-sm border-0 h-100">
      <div class="card-header bg-white py-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
           <h5 class="mb-0 fw-bold text-dark">Boletines Recientes</h5>
           <span class="badge bg-light text-dark border">{{ anunciosFiltrados.length }} Publicaciones</span>
        </div>

        <!-- Filters -->
        <div class="row g-2">
            <div class="col-md-7">
               <div class="input-group input-group-sm">
                   <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
                   <input type="text" class="form-control border-start-0" placeholder="Buscar título o contenido..." [(ngModel)]="searchTerm">
               </div>
            </div>
            <div class="col-md-5">
               <div class="input-group input-group-sm">
                   <span class="input-group-text bg-light border-end-0"><i class="bi bi-funnel"></i></span>
                   <select class="form-select border-start-0" [(ngModel)]="filterTipo">
                       <option value="todos">Todos los Tipos</option>
                       <option value="anuncio">Anuncio</option>
                       <option value="evento">Evento</option>
                       <option value="noticia">Noticia</option>
                   </select>
               </div>
            </div>
        </div>
      </div>
      <div class="card-body p-0" style="max-height: 80vh; overflow-y: auto;">

        <div *ngIf="anunciosFiltrados.length === 0" class="text-center py-5">
          <i class="bi bi-inbox fs-1 text-muted mb-3 d-block"></i>
          <p class="text-muted">No hay anuncios publicados.</p>
        </div>

        <div class="list-group list-group-flush">
          <div class="list-group-item p-4 border-bottom position-relative announcement-item" *ngFor="let anuncio of anunciosFiltrados">
            <!-- Type Badge -->
            <span class="position-absolute top-0 end-0 m-3 badge rounded-pill"
                  [ngClass]="{
                    'bg-primary': anuncio.tipo === 'anuncio',
                    'bg-success': anuncio.tipo === 'evento',
                    'bg-info text-dark': anuncio.tipo === 'noticia'
                  }">
              {{ anuncio.tipo | uppercase }}
            </span>

            <div class="d-flex align-items-center mb-2">
              <div class="me-2">
                <h5 class="mb-0 fw-bold text-dark">{{ anuncio.titulo }}</h5>
              </div>
            </div>

            <p class="text-secondary mb-3" style="white-space: pre-line;">{{ anuncio.descripcion }}</p>

            <div class="d-flex justify-content-between align-items-end">
              <div class="small text-muted">
                <div class="mb-1"><i class="bi bi-calendar-event me-1"></i> {{ anuncio.fecha_inicio | date:'medium' }}</div>
                <div *ngIf="anuncio.ubicacion"><i class="bi bi-geo-alt me-1"></i> {{ anuncio.ubicacion }}</div>
                <div class="mt-1"><i class="bi bi-people me-1"></i> Para: <strong>{{ anuncio.destinatarios }}</strong></div>
              </div>

              <div class="btn-group">
                <button class="btn btn-sm btn-outline-secondary" (click)="editAnuncio(anuncio)" title="Editar">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteAnuncio(anuncio.idEvento)" title="Eliminar">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
