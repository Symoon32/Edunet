<header class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <img src="logo-sin-fondo.png" alt="Escudo" width="40" height="40" class="d-inline-block align-text-top rounded bg-white p-1">
      <span class="fw-bold">Colegio Jorge Isaacs</span>
    </a>
  </div>
</header>

<main class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg border-0" style="max-width: 450px; width: 100%;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <div class="icon-circle bg-light-primary text-primary mb-3 mx-auto">
          <i class="bi bi-key-fill fs-2"></i>
        </div>
        <h3 class="fw-bold">¿Olvidaste tu contraseña?</h3>
        <p class="text-muted small">Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>
      </div>

      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <div class="form-floating mb-3">
          <input type="email" id="correo" [(ngModel)]="correo" name="correo" required
                 class="form-control" placeholder="nombre@ejemplo.com" autocomplete="email">
          <label for="correo">Correo Electrónico</label>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary btn-lg rounded-pill" [disabled]="form.invalid">
            Enviar Enlace <i class="bi bi-send-fill ms-2"></i>
          </button>
          <a routerLink="/" class="btn btn-light btn-lg rounded-pill mt-2">
            Volver al Login
          </a>
        </div>

        @if (mensaje) {
          <div class="alert alert-success mt-4 mb-0 py-2 small text-center rounded-3">
            <i class="bi bi-check-circle-fill me-2"></i> {{ mensaje }}
          </div>
        }

        @if (error) {
          <div class="alert alert-danger mt-4 mb-0 py-2 small text-center rounded-3">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
          </div>
        }
      </form>
    </div>
  </div>
</main>
