<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cargar Notas y Observaciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/Edunet-Estructura/app/static/css profesores/cargar notas2.css" />
</head>
<body>
  <header class="d-flex align-items-center p-3 header-color text-white">
    <img src="/Edunet-Estructura/app/static/img/logo sin fondo.png" alt="Escudo del colegio" class="logo me-3" />
    <h1 class="h4 m-0">Bienvenidos a EduNet - Docentes</h1>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
      <span style="color: white;">Nombre del Usuario</span>
      <a href="/Edunet-Estructura/app/templates/html estudiantes/perfilbootstrap.html" title="Perfil del usuario">
        <img src="/Edunet-Estructura/app/static/img/foto perfil.avif" alt="Perfil" style="width: 32px; height: 32px; border-radius: 50%;">
      </a>
    </div>
  </header>

  <nav class="background-dark">
    <div class="container">
      <ul class="nav nav-pills py-2">
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/index pagina principal Profesores.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores gestion de clase.html"> Gestión de clases</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores Material Educativo.html">Gestion de Material</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores Calificar material.html">Calificar Material</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores Comunicación.html">Comunicación</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores Reportes.html"> Generar Reportes</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/Edunet-Estructura/app/templates/html profesores/Profesores Estadisticas.html">Estadisticas</a></li>
        <li class="nav-item"><a class="nav-link text-white active" href="/Edunet-Estructura/app/templates/html profesores/Profesores Cargar nota.html">Cargar notas</a></li>
        <a href="/Edunet-Estructura/app/templates/inicio de sesion.html" class="btn btn-danger">
        <i class="bi bi-box-arrow-right"></i></a>
      </ul>
    </div>
  </nav>
  <main class="container my-5">
    <h2 class="text-primary mb-4">Cargar Notas y Observaciones</h2>
    <section class="bg-white p-4 rounded shadow-sm mb-4">
      <div class="mb-3">
        <label for="estudiante" class="form-label">Estudiante:</label>
        <input type="text" id="estudiante" class="form-control" placeholder="Nombre del estudiante">
      </div>

      <div class="mb-3">
        <label for="materia" class="form-label">Materia:</label>
        <input type="text" id="materia" class="form-control" placeholder="Ej: Matemáticas">
      </div>

      <div class="mb-3">
        <label for="nota" class="form-label">Nota:</label>
        <input type="number" id="nota" class="form-control" placeholder="Ej: 4.5" step="0.1" min="0" max="5">
      </div>

      <div class="mb-3">
        <label for="observacion" class="form-label">Observación:</label>
        <textarea id="observacion" class="form-control" rows="3" placeholder="Escribe una observación..."></textarea>
      </div>

      <button onclick="guardarNota()" class="btn btn-primary w-100">Guardar</button>
    </section>

    <section class="bg-light border border-primary border-dashed p-4 rounded mb-4">
      <h4 class="text-primary">Boletín para la Comunidad</h4>
      <textarea id="anuncio" class="form-control mb-3" rows="3" placeholder="Escribe un anuncio o boletín..."></textarea>
      <button onclick="enviarAnuncio()" class="btn btn-secondary">Enviar Boletín</button>
    </section>


    <section id="resultado" class="resultado mt-4"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/Edunet-Estructura/app/static/js/js profesores/cargar_notas_orbservaciones.js"></script>
  <footer class="text-center py-3 footer-color">
    <p class="mb-0">&copy; 2025 Colegio Jorge Isaacs - EduNet</p>
  </footer>
</body>
</html>
