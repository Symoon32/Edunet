<div class="row justify-content-center">
  <div class="col-lg-10 col-xl-8">
    <div class="card p-4 shadow-sm">
      <h2 class="mb-3">Configurar Cursos</h2>
      <p class="text-muted">Organiza los programas académicos y asigna docentes a los cursos.</p>

      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Nombre del curso o programa">
        </div>
        <div class="col-md-6">
          <select class="form-select">
            <option value="">Asignar docente...</option>
            <option value="1">Laura Gómez</option>
            <option value="2">Miguel Díaz</option>
            <option value="3">Andrés López</option>
          </select>
        </div>
      </div>

      <div class="row g-2 mb-4">
        <div class="col-md-4">
          <button class="btn btn-success w-100">Crear Curso</button>
        </div>
        <div class="col-md-4">
          <button class="btn btn-warning w-100">Modificar Curso</button>
        </div>
        <div class="col-md-4">
          <button class="btn btn-danger w-100">Eliminar Curso</button>
        </div>
      </div>

      <h6 class="fw-bold mb-2">Cursos Configurados</h6>
    </div>
  </div>
</div>
