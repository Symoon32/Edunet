<div class="row justify-content-center">
  <div class="col-lg-10 col-xl-8">
    <div class="card p-4 shadow-sm">
      <h2 class="mb-3">Observaciones</h2>
      <p class="text-muted">Registra observaciones por curso para docentes o estudiantes.</p>

      <div class="row mb-3 g-2">
        <div class="col-md-6">
          <select class="form-select">
            <option value="">Seleccionar tipo de usuario</option>
            <option value="docente">Docente</option>
            <option value="estudiante">Estudiante</option>
          </select>
        </div>
        <div class="col-md-6">
          <select class="form-select">
            <option value="">Seleccionar curso</option>
            <option value="6A">6°A</option>
            <option value="7B">7°B</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <select class="form-select">
          <option value="">Seleccionar nombre</option>
          <option value="1">Juan Pérez</option>
          <option value="2">Laura Gómez</option>
        </select>
      </div>

      <div class="mb-3">
        <textarea class="form-control" rows="4" placeholder="Escribe la observación..."></textarea>
      </div>

      <div class="row g-2 mb-4">
        <div class="col-md-4">
          <button class="btn btn-success w-100">Guardar</button>
        </div>
        <div class="col-md-4">
          <button class="btn btn-warning w-100">Editar</button>
        </div>
        <div class="col-md-4">
          <button class="btn btn-danger w-100">Eliminar</button>
        </div>
      </div>

      <h6 class="fw-bold mb-2">Observaciones recientes</h6>
      <ul class="list-group">
        <li class="list-group-item">
          <strong>Juan Pérez - 6°A</strong><br>
          Se destaca por su participación activa en clase. (Fecha: 21/06/2025)
        </li>
        <li class="list-group-item">
          <strong>Laura Gómez - Docente</strong><br>
          Aumentó el uso de recursos digitales en sus clases. (Fecha: 19/06/2025)
        </li>
      </ul>
    </div>
  </div>
</div>
