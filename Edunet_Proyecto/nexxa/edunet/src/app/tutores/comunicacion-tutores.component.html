

<main class="container my-5">
  <section>
    <h2 class="mb-3">Comunicación con Docentes y Administración</h2>
    <p class="mb-4">Escribe tus dudas o comentarios respecto al rendimiento académico del estudiante.</p>
    <div class="row justify-content-center">
      <div class="col-lg-7 mb-4">
        <form action="#" method="post" class="p-4 border rounded bg-white shadow-sm">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del acudiente:</label>
            <input type="text" id="nombre" name="nombre" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="estudiante" class="form-label">Nombre del estudiante:</label>
            <input type="text" id="estudiante" name="estudiante" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="curso" class="form-label">Curso:</label>
            <input type="text" id="curso" name="curso" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="5" class="form-control" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="boton">Enviar mensaje</button>
        </form>
      </div>
      <div class="col-lg-4">
        <div class="bg-light p-4 rounded shadow-sm h-50">
          <h3 class="mb-3 text-primary">Contáctanos</h3>
          <p><strong>Correo de contacto:</strong> coljorgeisaacs@hotmail.com</p>
          <p><strong>Celular:</strong> +57 3173418498</p>
          <p><strong>Dirección:</strong> CL 6 #3 ESTE - 15 Soacha, Colombia</p>
        </div>
      </div>
    </div>
  </section>
</main>
