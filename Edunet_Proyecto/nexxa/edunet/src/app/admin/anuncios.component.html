<div class="row justify-content-center">
  <div class="col-lg-10 col-xl-8">
    <div class="card p-4 shadow-sm">
      <h2 class="mb-3">Anuncios y Boletines Informativos</h2>
      <p class="text-muted">Publica información relevante para toda la comunidad educativa.</p>

      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Título del anuncio o boletín">
      </div>

      <div class="mb-3">
        <textarea class="form-control" rows="4" placeholder="Contenido del anuncio o boletín..."></textarea>
      </div>

      <div class="row g-2 mb-4">
        <div class="col-md-4">
          <button class="btn btn-success w-100">Publicar</button>
        </div>
        <div class="col-md-4">
          <button class="btn btn-warning w-100">Editar</button>
        </div>
        <div class="col-md-4">
          <button class="btn btn-danger w-100">Eliminar</button>
        </div>
      </div>

      <h6 class="fw-bold mb-2">Últimos boletines</h6>
      <ul class="list-group">
        <!-- Aquí puedes agregar dinámicamente los boletines si lo deseas -->
      </ul>
    </div>
  </div>
</div>
